name: check

# 这个仓库的验收线只有一条：build + 判据 + 准确率评测全绿。
# 本机命令等同 `npm run check`，所以 CI 红 == 本地红，不存在「只有 CI 才跑的东西」。
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 零依赖：不需要 npm install。
      - name: Build and check
        run: npm run check
      # 产物必须由当前源码生成，防止提交一个跟源码不同步的 client.js。
      - name: Artifact is current
        run: git diff --exit-code -- client.js

name: check

# 这条验收线只有一条硬性要求：build + 判据 + 准确率评测全绿。
# 本机命令等同 `npm run check`，所以 CI 红 == 本地红，不存在「只有 CI 才跑的东西」。
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 运行时零依赖：`npm run check` 不需要 install。
      - name: Build and check
        run: npm run check
      # 产物必须由当前源码生成，防止提交一个跟源码不同步的 client.js。
      - name: Artifact is current
        run: git diff --exit-code -- client.js
      # 类型体检（报告 P2#18）：先只报错不阻断。
      # 现在本地是 0 错，但这是「体检」不是验收线 —— 新版 tsc 加一条检查
      # 不该让整个仓库变红。等它稳定一段时间再决定是否升级成阻断。
      - name: Type check (non-blocking)
        continue-on-error: true
        run: |
          npm install --no-save typescript@5 @types/node@22
          npm run typecheck

name: check

# 这条验收线只有一条硬性要求：build + 判据 + 准确率评测全绿。
# 本机命令等同 `npm run check`，所以 CI 红 == 本地红，不存在「只有 CI 才跑的东西」。
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 0.3.0 起这条不再是「零依赖」：宿主半区 import 了 `@deepseek-ai/schemastery`
      # （设置卡的 schema），而判据会 import index.js。少了这一步，CI 报的是
      # MODULE_NOT_FOUND，看着像代码坏了，其实是没装依赖。
      - name: Install dependencies
        run: npm ci
      - name: Build and check
        run: npm run check
      # 产物必须由当前源码生成，防止提交一个跟源码不同步的 client.js。
      - name: Artifact is current
        run: git diff --exit-code -- client.js
      # 类型体检（报告 P2#18）：先只报错不阻断。
      # 现在本地是 0 错，但这是「体检」不是验收线 —— 新版 tsc 加一条检查
      # 不该让整个仓库变红。等它稳定一段时间再决定是否升级成阻断。
      - name: Type check (non-blocking)
        continue-on-error: true
        run: npm run typecheck
